<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For My Madam Ji ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Music Button -->
<button id="musicBtn" onclick="playMusic()">🎵 Play Music</button>

<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

<!-- Hearts Container -->
<div id="heart-container"></div>

<div class="card">
  <h2 id="title">Do you love me? 🥺❤️</h2>

  <!-- WORKING GIF -->
  <img id="image" src="https://media.tenor.com/9Xn1XjCz3N8AAAAi/bear-love.gif" alt="Love Bear">

  <div class="buttons" id="buttons">
    <button onclick="yesClicked()">YES 💖</button>
    <button id="noBtn" onmouseover="moveNo()">NO 😈</button>
  </div>

  <button id="nextBtn" onclick="nextPage()">Click Me 💌</button>
</div>

<script src="script.js"></script>
</body>
</html>
