<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For My Madam Ji ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="musicBtn" onclick="playMusic()">🎵 Play Music</button>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/09/audio_8f1e1c2a1c.mp3?filename=romantic-piano-ambient-113199.mp3" type="audio/mpeg">
</audio>

<div id="heart-container"></div>
<div id="emoji-container"></div>

<div class="card">
  <h2 id="title">Do you love me? 🥺❤️</h2>

  <div class="buttons" id="buttons">
    <button onclick="yesClicked()">YES 💖</button>
    <button id="noBtn" onmouseover="moveNo()">NO 😈</button>
  </div>

  <button id="nextBtn" onclick="nextPage()">Click Me 💌</button>
</div>

<script src="script.js"></script>
</body>
</html>
