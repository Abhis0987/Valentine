<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Baacha ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<button id="musicBtn" onclick="playMusic()">🎵 Play Music</button>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/09/audio_8f1e1c2a1c.mp3" type="audio/mpeg">
</audio>

<!-- Love Letter Popup -->
<div id="letterPopup">
  <div class="letter">
    <h3>💌 My Baacha 💌</h3>
    <p>
      You walked into my life quietly,<br>
      but changed everything loudly ❤️<br><br>
      I don’t promise perfection,<br>
      but I promise honesty, loyalty,<br>
      and love that never fades.
    </p>
    <button onclick="closeLetter()">Close 💖</button>
  </div>
</div>

<div class="card">
  <h1 class="name">Baacha 💕</h1>
  <h2 id="title">Do you love me? 🥺❤️</h2>

  <div id="buttons">
    <button onclick="yesClicked()">YES 💖</button>
    <button id="noBtn" onmouseover="moveNo()">NO 😈</button>
  </div>

  <button id="nextBtn" onclick="nextPage()">Next 💌</button>
</div>

<script src="script.js"></script>
</body>
</html>
